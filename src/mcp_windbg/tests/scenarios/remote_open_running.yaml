name: Open a remote session while the target is running
description: >
  open_cdb_remote against a debug server whose target is already running (the
  server's operator resumed it) leaves it running unless break_in is set, holds
  the init commands for the first command that stops it, and a close after a
  break-in lets it run again. Every claim about the target's state is checked
  by a fresh client, which finds the target running or not on its own.
requires:
  remote:
    target: ["waitfor.exe", "SomeSignalThatNeverComes"]   # blocks forever once resumed
server:
  args: ["--init-command", ".echo MCP_HELD_INIT"]
steps:
  - server_input: "g"        # resume the target from the server side before anyone attaches
    wait: 1.0

  # Attaching leaves it running and gathers nothing.
  - call: open_cdb_remote
    arguments:
      connection_string: "{remote}"
      timeout_seconds: 30
    capture:
      sid: 'session_id:\s*(cdb-[0-9a-f]+)'
    expect:
      isError: false
      contains:
        - "session_id: cdb-"
        - "Target State"
        - "this open left it running"
        - "init commands have not run"
      not_contains:
        - "Break instruction exception"
        - "Current Registers"
        - "MCP_HELD_INIT"

  # The first ordinary command stops it, after the held init commands.
  - call: run_cdb_command
    arguments:
      session_id: "{sid}"
      command: "r"
    expect:
      isError: false
      contains:
        - "### Initialization"
        - "MCP_HELD_INIT"
        - "Break instruction exception"
        - "rip="
      regex:
        - '(?s)### Initialization.*MCP_HELD_INIT.*Command: r'

  # Closing detaches and resumes it.
  - call: close_cdb_session
    arguments:
      session_id: "{sid}"
    expect:
      contains:
        - "Successfully closed cdb session"

  # A fresh client finds it running again, and break_in stops it for triage.
  - call: open_cdb_remote
    arguments:
      connection_string: "{remote}"
      timeout_seconds: 30
      break_in: true
    capture:
      sid2: 'session_id:\s*(cdb-[0-9a-f]+)'
    expect:
      isError: false
      contains:
        - "Target State"
        - "was running when the client attached"
        - "MCP_HELD_INIT"
        - "Break instruction exception"
        - "Current Registers"

  # Stopped for real: an ordinary command answers without another break-in.
  - call: run_cdb_command
    arguments:
      session_id: "{sid2}"
      command: "r"
    expect:
      isError: false
      contains:
        - "rip="
      not_contains:
        - "Break instruction exception"
        - "MCP_HELD_INIT"

  - call: close_cdb_session
    arguments:
      session_id: "{sid2}"
    expect:
      contains:
        - "Successfully closed cdb session"

  # The break-in session's close resumed it too; this time, stop it for good.
  - call: open_cdb_remote
    arguments:
      connection_string: "{remote}"
      timeout_seconds: 30
      break_in: true
    capture:
      sid3: 'session_id:\s*(cdb-[0-9a-f]+)'
    expect:
      isError: false
      contains:
        - "was running when the client attached"
        - "Current Registers"

  - call: close_cdb_session
    arguments:
      session_id: "{sid3}"
      resume: false
    expect:
      contains:
        - "Successfully closed cdb session"

  # resume: false left it stopped, so the next client meets a prompt.
  - call: open_cdb_remote
    arguments:
      connection_string: "{remote}"
      timeout_seconds: 30
    capture:
      sid4: 'session_id:\s*(cdb-[0-9a-f]+)'
    expect:
      isError: false
      contains:
        - "Current Registers"
      not_contains:
        - "Target State"

  - call: close_cdb_session
    arguments:
      session_id: "{sid4}"
    expect:
      contains:
        - "Successfully closed cdb session"

name: Tools contract
description: The server advertises exactly the eleven harmonized, session-id tools.
steps:
  - list_tools: true
    expect:
      contains:
        - list_dumps
        - open_cdb_dump
        - open_cdb_remote
        - open_kd_session
        - open_kd_dump
        - run_cdb_command
        - run_kd_command
        - close_cdb_session
        - close_kd_session
        - send_ctrl_break
        - wait_for_break
        - "-server tcp:port=5005 -noio"
        - "NUL"
        - "nonpaged pool"
        - "freeze the host"
        - "only the MCP client"
        - "never to the MCP-managed -remote client"
        - "https://github.com/microsoft/WinDbg-Feedback/issues/402"
      not_contains:
        - open_windbg_dump
        - run_windbg_cmd
        - open_windbg_kernel

name: Build and Test

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to test'
        required: false
        type: string
        default: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      check-version:
        description: 'Run the version-consistency check (release builds only)'
        required: false
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: 'Name of the build artifact'
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true

    - name: Install WinDbg from Microsoft Store
      run: winget install 9PGJGD53TN86 --accept-source-agreements --accept-package-agreements

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"   # pinned; bump deliberately, Dependabot does not
        # The default cache key is taken from the runner's own Python, which is
        # the same on every matrix leg, so all five raced to save one entry and
        # four of them warned "Unable to reserve cache". The cache holds the
        # wheels for the interpreter uv installs below, so one per version is
        # also the correct cache, not just a quiet one.
        cache-suffix: ${{ matrix.python-version }}

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    # uv.lock is not something release-please knows how to update, so it went
    # stale for a whole release once without anything noticing. `uv sync` would
    # quietly refresh it, so check before syncing, not after.
    - name: Check uv.lock is in step with pyproject.toml
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests with coverage
      env:
        MCP_WINDBG_COVERAGE: "1"   # measure the hosted server subprocess
      run: |
        uv run coverage erase
        # `coverage run -m pytest` (not plain pytest) so the hermetic unit tests
        # in the pytest process are measured too - the hosted server subprocess
        # alone never exercises them. Both write parallel-mode data files.
        uv run coverage run -m pytest src/mcp_windbg/tests/ -v --tb=short
        uv run coverage combine
        # The floor has margin for cross-version and cdb-output jitter across the
        # Windows x 5-Python-version matrix. Kernel scenarios skip here (no target),
        # so kd_session is held up by its hermetic tests; see CLAUDE.md for the
        # local run that covers it for real.
        uv run coverage report --fail-under=88

    - name: Test CLI entry point
      run: |
        # Test that the CLI entry point works
        uv run python -m mcp_windbg --help || echo "CLI help command completed"

    - name: Check version consistency
      if: ${{ inputs.check-version }}
      run: .\scripts\check-version-consistency.ps1

    - name: Validate server.json schema
      run: uv run python scripts/validate-server-schema.py

  # The standalone binary is a second way to ship the same server, and freezing
  # is where a dependency's runtime import tricks show up: an installed wheel
  # finds its data files and lazy imports, a PyInstaller bundle only ships what
  # the analysis saw. Building it is not the test - serving MCP from it is, so
  # the scenario suite runs again with the binary in place of python -m.
  exe:
    runs-on: windows-latest
    needs: test

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true

    - name: Install WinDbg from Microsoft Store
      run: winget install 9PGJGD53TN86 --accept-source-agreements --accept-package-agreements

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"   # pinned; bump deliberately, Dependabot does not

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: uv sync --dev --group dist

    - name: Build and verify mcp-windbg.exe
      run: pwsh scripts/Build-Exe.ps1 -Verify

    - name: Upload mcp-windbg.exe
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        # Named for what it is: this job builds before signing, and on a pull
        # request there is no signing at all. The signed binary is a separate
        # artifact, and the release asset is the copy anyone should use.
        name: mcp-windbg-exe-unsigned
        path: dist/mcp-windbg.exe
        retention-days: 7

  build:
    runs-on: windows-latest
    needs: test
    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        lfs: true

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"   # pinned; bump deliberately, Dependabot does not

    - name: Set up Python
      run: uv python install 3.10

    - name: Build package
      run: uv build

    - name: Check package
      run: uv run twine check dist/*

    - name: Set artifact name
      id: set-artifact-name
      run: |
        $artifactName = "dist-packages-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
        echo "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.set-artifact-name.outputs.artifact-name }}
        path: dist/
        retention-days: 7

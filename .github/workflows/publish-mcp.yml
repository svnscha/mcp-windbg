name: Publish MCP Server

# Called by release-please.yml once it has cut the tag and the GitHub release.
# It is no longer triggered by a tag push: release-please creates the tag with
# GITHUB_TOKEN, and tags pushed by that token do not start workflow runs, so a
# `push: tags` trigger here would never fire. workflow_dispatch stays for
# publishing by hand if a release ever needs re-shipping.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to attach the signed mcp-windbg.exe to. Omit to sign without attaching.'
        required: false
        type: string
      rehearsal:
        description: 'Build, sign and attach, but publish nothing to PyPI.'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the signed mcp-windbg.exe to. Omit to sign without attaching.'
        required: false
        type: string
      # Defaults the other way round from workflow_call on purpose. A release
      # publishes; a run started by hand is a rehearsal unless someone says
      # otherwise, because the usual reason to start one is to exercise the
      # signing path, and the usual cost of getting it wrong is a bad upload to
      # PyPI that cannot be taken back.
      rehearsal:
        description: 'Build, sign and attach, but publish nothing to PyPI.'
        required: false
        default: true
        type: boolean

jobs:
  build-and-test:
    uses: ./.github/workflows/build-and-test.yml
    with:
      # The version-consistency check is a release gate, and it fails by design
      # while CHANGELOG.md carries an `## [Unreleased]` heading. A rehearsal is
      # not shipping anything, so it does not run it.
      check-version: ${{ !inputs.rehearsal }}

  verify-build:
    runs-on: windows-latest
    needs: build-and-test

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build-and-test.outputs.artifact-name }}
        path: dist/

    - name: List downloaded artifacts
      run: |
        Write-Host "Downloaded artifacts:"
        Get-ChildItem -Path "dist/" -Recurse | Format-Table Name, Length, LastWriteTime

  # Signs the standalone executable on a self-hosted runner, which the signing
  # service requires.
  #
  # Two rules keep that safe and both must hold if this job is ever changed: it
  # must stay out of reach of `pull_request`, `pull_request_target` and
  # `issue_comment`, which would run a fork's code on the runner, and it must
  # never check out the repository.
  sign:
    needs: build-and-test
    # Skips in a fork, which cannot reach the runner and would queue forever.
    if: github.repository == 'svnscha/mcp-windbg'
    runs-on: [self-hosted, mcp-windbg-sign]
    environment: signing
    # Needs none: same-run artifact transfer does not use GITHUB_TOKEN.
    permissions: {}

    steps:
    - name: Download the unsigned mcp-windbg.exe
      uses: actions/download-artifact@v8
      with:
        name: mcp-windbg-exe
        path: unsigned/

    - name: Sign it
      # --fail-with-body is required: without it a failure response is written
      # over the output file and curl still exits 0.
      #
      # The endpoint comes from a secret so it stays out of the logs, and is
      # read through the environment rather than interpolated into the script.
      env:
        SIGNING_URL: ${{ secrets.SIGNING_URL }}
      run: |
        mkdir -p signed
        curl -sS --fail-with-body -X POST "$SIGNING_URL" \
          -F "File=@unsigned/mcp-windbg.exe" \
          -o signed/mcp-windbg.exe

    - name: Verify the signature
      # Checks the digest, the chain, the countersignature and the CRLs, and
      # exits 1 on an unsigned binary.
      run: osslsigncode verify signed/mcp-windbg.exe

    - name: Upload the signed mcp-windbg.exe
      uses: actions/upload-artifact@v7
      with:
        name: mcp-windbg-exe-signed
        path: signed/mcp-windbg.exe
        retention-days: 7

  # Separate job so the write token stays off the self-hosted runner.
  attach:
    needs: sign
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download the signed mcp-windbg.exe
      uses: actions/download-artifact@v8
      with:
        name: mcp-windbg-exe-signed
        path: signed/

    - name: Attach it to the release with its checksum
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gh infers the repository from a git remote, and this job has no
        # checkout, so it has to be told.
        GH_REPO: ${{ github.repository }}
        TAG: ${{ inputs.tag }}
      # Hashed after signing: signing rewrites the PE, so a digest taken
      # earlier would match nothing anyone can download.
      run: |
        cd signed
        sha256sum mcp-windbg.exe > SHA256SUMS
        gh release upload "$TAG" mcp-windbg.exe SHA256SUMS --clobber
        {
          echo "Signed \`mcp-windbg.exe\` attached to \`$TAG\`."
          echo
          echo '```'
          cat SHA256SUMS
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !inputs.rehearsal }}
    permissions:
      contents: read

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ needs.build-and-test.outputs.artifact-name }}
        path: dist/

    - name: List downloaded artifacts
      run: |
        echo "Downloaded artifacts:"
        ls -la dist/

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"
        enable-cache: false  # No cache needed for publish-only job

    - name: Publish to PyPI
      run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    - name: Create GitHub Release Summary
      run: |
        echo "## 🎉 Package Published Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "📦 Published to **PyPI**: https://pypi.org/project/mcp-windbg/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo 'pip install mcp-windbg' >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
